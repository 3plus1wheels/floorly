name: Quality gates

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_ENV: production
      DEBUG: 'False'
      SECRET_KEY: ci-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost
      DATABASE_URL: sqlite:////tmp/ci.sqlite3
      SECURE_HSTS_SECONDS: '31536000'
      SECURE_HSTS_INCLUDE_SUBDOMAINS: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run extension:build
        env:
          BUILD_MODE: production
          EXTENSION_VERSION: 1.0.1
          FLOORLY_WEB_ORIGINS: https://floorly.vovanguyen.com
          FLOORLY_API_ORIGINS: https://floorly.vovanguyen.com
          KRONOS_ALLOWED_ORIGINS: https://levistrauss-sso.prd.mykronos.com
          KRONOS_SCHEDULE_URL: 'https://levistrauss-sso.prd.mykronos.com/ess#/3009002/location-schedule'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test -- --watchAll=false --ci
      - run: npm --prefix frontend run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -c "from pathlib import Path; Path('/tmp/requirements.txt').write_text(Path('requirements.txt').read_text(encoding='utf-16'))"
      - run: pip install -r /tmp/requirements.txt
      - run: python manage.py check --deploy
      - run: python manage.py test
